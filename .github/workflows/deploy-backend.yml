# Sets up / updates the portal's backend on Supabase:
# database tables and security rules, server functions, their secret settings, sign-up lock and the email schedule.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   the project's reference ID (Project Settings > General)
#   GMAIL_USER             the club Gmail address that sends the emails
#   GMAIL_APP_PASSWORD     a Gmail app password for that account (16 letters)
#   ADMIN_EMAIL            the email of the first admin account
name: Deploy backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/**']

permissions:
  contents: read
  actions: write

concurrency:
  group: backend
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      API: https://api.supabase.com/v1
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        run: |
          missing=""
          for s in SUPABASE_ACCESS_TOKEN REF GMAIL_USER GMAIL_APP_PASSWORD ADMIN_EMAIL; do
            if [ -z "${!s}" ]; then missing="$missing $s"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (REF = SUPABASE_PROJECT_REF). See SETUP.md."
            exit 1
          fi

      - name: Create or update the database
        run: |
          run_sql() {
            jq -Rs '{query: .}' "$1" > /tmp/body.json
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "$API/projects/$REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @/tmp/body.json)
            if [ "$code" -ge 300 ]; then echo "::error::$1 failed ($code)"; cat /tmp/out.json; exit 1; fi
            echo "$1 OK"
          }
          run_sql supabase/schema.sql
          sed "s#__FUNCTIONS_URL__#https://$REF.supabase.co/functions/v1#" supabase/cron.sql > /tmp/cron.sql
          run_sql /tmp/cron.sql

      - name: Lock sign-ups (only approved members get accounts)
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY#*/}"
          SITE="https://$OWNER.github.io/$REPO/portal/"
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X PATCH "$API/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data "{\"disable_signup\": true, \"site_url\": \"$SITE\", \"uri_allow_list\": \"$SITE**,http://localhost:5173/**\"}")
          if [ "$code" -ge 300 ]; then echo "::warning::Could not update auth settings ($code). Turn off 'Allow new users to sign up' in Supabase > Authentication > Sign In / Providers."; cat /tmp/out.json; fi

      - name: Save the server functions' secret settings
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY#*/}"
          npx --yes supabase@2.120.0 secrets set --project-ref "$REF" \
            GMAIL_USER="$GMAIL_USER" \
            GMAIL_APP_PASSWORD="$GMAIL_APP_PASSWORD" \
            ADMIN_EMAIL="$ADMIN_EMAIL" \
            PORTAL_URL="https://$OWNER.github.io/$REPO/portal/" \
            ALLOWED_ORIGINS="https://$OWNER.github.io,http://localhost:5173,http://127.0.0.1:5173"

      - name: Deploy the server functions
        run: npx --yes supabase@2.120.0 functions deploy --project-ref "$REF" --use-api

      - name: Rebuild the website with the Supabase connection
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
