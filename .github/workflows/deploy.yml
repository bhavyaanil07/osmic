# Publishes the whole OSMIC site to GitHub Pages on every push to main:
#   /          the OSMIC website (index.html, style.css, script.js, content.js, images/)
#   /portal/   the member portal (built from the portal/ folder)
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
name: Deploy OSMIC site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Build the portal
        working-directory: portal
        run: |
          npm ci
          npm run build
      - name: Put the website and portal together
        run: |
          mkdir -p _site/portal
          cp index.html style.css script.js content.js _site/
          cp -r images _site/
          cp -r portal/dist/. _site/portal/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
