# Publishes the whole OSMIC site to GitHub Pages on every push to main:
#   /          the OSMIC website (index.html, style.css, script.js, content.js, images/)
#   /portal/   the member portal (built from the portal/ folder)
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
name: Deploy OSMIC site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      # Looks up the Supabase address and public (publishable/anon) key so the portal can connect.
      # Both are safe to be public. Skipped until the SUPABASE_* secrets exist (the portal then shows a setup notice).
      - name: Connect to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then echo "Supabase secrets not set yet; building without a connection."; exit 0; fi
          keys=$(curl -sS "https://api.supabase.com/v1/projects/$REF/api-keys?reveal=true" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          key=$(echo "$keys" | jq -r '[.[] | select(.type == "publishable")][0].api_key // empty')
          [ -z "$key" ] && key=$(echo "$keys" | jq -r '[.[] | select(.name == "anon")][0].api_key // empty')
          if [ -z "$key" ]; then echo "::error::Could not read the project's public key. Check SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF."; echo "$keys" | head -c 300; exit 1; fi
          echo "VITE_SUPABASE_URL=https://$REF.supabase.co" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_KEY=$key" >> "$GITHUB_ENV"
      - name: Build the portal
        working-directory: portal
        run: |
          npm ci
          npm run build
      - name: Put the website and portal together
        run: |
          mkdir -p _site/portal
          cp index.html style.css script.js content.js _site/
          cp -r images _site/
          cp -r portal/dist/. _site/portal/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
